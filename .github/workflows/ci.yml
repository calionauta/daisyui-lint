name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (includes the snapshot-vs-skill drift check)
        run: go test ./...
      - name: The bundled snapshot is current
        run: |
          make vocabulary
          git diff --exit-code -- daisyui/vocabulary.json
      - name: Vet and gofmt
        run: |
          go vet ./...
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - name: Build
        run: go build ./...
      - name: Dogfood on the vendored skill
        run: |
          go run ./cmd/daisyui-lint --strict --css cmd/daisyui-lint/testdata/consumer/acme/app.css ./cmd/daisyui-lint/testdata/consumer
